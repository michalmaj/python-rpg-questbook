#   1. tool.coverage.run  — what to measure
#      source = ["rpg"]
#      omit = ["test_*.py"]
#
#   2. tool.coverage.report  — how to display and enforce the threshold
#      fail_under = 80
#      show_missing = true
#
# Then run: uv run pytest --cov=rpg --cov-report=term-missing
