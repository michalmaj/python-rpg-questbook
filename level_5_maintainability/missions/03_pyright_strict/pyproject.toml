[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer.Option() in function defaults is the intended pattern

[tool.mypy]
strict = true
ignore_missing_imports = true

